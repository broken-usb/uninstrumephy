name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Instalar dependências nativas de sistema (X11, Qt e Áudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            xvfb \
            portaudio19-dev \
            libsndfile1 \
            libpulse0

      - name: Instalar uv e Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Instalar dependências do uv.lock (PyTorch só CPU)
        # O uv sync traria o PyTorch com CUDA (~3 GB); os testes só precisam do de CPU.
        run: bash packaging/install_cpu_deps.sh .venv/bin/python

      - name: Análise Estática (Lint)
        run: |
          # Interrompe em erros de sintaxe ou nomes não definidos
          uv run --no-sync flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos gerais
          uv run --no-sync flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Executar Testes com Display Virtual
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a uv run --no-sync pytest -v

  test-windows:
    # Os mesmos testes num Windows de verdade (interface sem janela, sem placa
    # de som). No Windows, o PyTorch do uv.lock (PyPI) já é a versão para CPU.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Instalar uv e Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Instalar dependências do uv.lock
        run: uv sync --locked

      - name: Executar Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -v
