name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar dependências nativas de sistema (X11, Qt e Áudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            xvfb \
            portaudio19-dev \
            libsndfile1

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar PyTorch (CPU) e Dependências
        run: |
          python -m pip install --upgrade pip
          # Instala versão CPU do torch/torchaudio antes para evitar download do CUDA
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Análise Estática (Lint)
        run: |
          # Interrompe em erros de sintaxe ou nomes não definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos gerais
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Executar Testes com Display Virtual
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a pytest -v