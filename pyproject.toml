[project]
name = "uninstrumephy"
version = "0.1.0"
description = "Separação de guitarra (Demucs), Tone Matching e controle da pedaleira ESP32-S3."
readme = "README.md"
authors = [
    { name = "broken-usb", email = "50057556+broken-usb@users.noreply.github.com" }
]
# 3.12 é o mínimo testado no CI e a versão do Python embutida no AppImage.
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.1.0",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyqt6>=6.12.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tinytag>=2.3.2",
    "tqdm>=4.70.1",
]

# Ferramentas de desenvolvimento: o `uv sync` as instala por padrão.
[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.0",
]

[tool.uv]
# Versão mínima do uv que lê este uv.lock (também usada pelo CI).
required-version = ">=0.13.5"
# O programa roda direto da pasta do projeto (`uv run main.py`); não há
# pacote Python a construir e instalar.
package = false
# Sistemas suportados. Sem isto, o uv resolveria o lock também para o macOS,
# onde o demucs 4.1 exige numpy < 2 (incompatível com numpy >= 2.5).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
