[project]
name = "uninstrumephy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "broken-usb", email = "50057556+broken-usb@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "demucs>=4.0.1",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyqt6>=6.12.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tinytag>=2.3.2",
    "tqdm>=4.70.1",
]

[project.scripts]
uninstrumephy = "uninstrumephy:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
